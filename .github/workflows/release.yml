name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.12.5"
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: "pyproject.toml"

    - name: Pin python version
      run: uv python pin 3.12

    - name: Install the project
      # --frozen so the sync does not rewrite uv.lock; a rewritten (tracked)
      # lock file dirties the working tree, which makes hatch-vcs emit a
      # ".dev0+...dirty" version instead of the exact tag being released.
      run: uv sync --all-extras --dev --frozen

    - name: Run tests
      run: uv run pytest

    - name: Build project
      run: uv build

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: dist/*
