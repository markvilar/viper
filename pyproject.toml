[project]
name = "libviper"
dynamic = ["version"]
description = "A package for visual place recognition (VPR) models."
readme = "README.md"
authors = [
  { name = "Martin Kvisvik Larsen", email = "martin.kvisvik.larsen@hotmail.com" }
]
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = [
  "visual place recognition",
  "vpr",
  "image retrieval",
  "computer vision",
  "deep learning",
  "pytorch",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "imageio>=2.37.0",
  "loguru>=0.7.3",
  "msgspec>=0.19.0",
  "python-dotenv>=1.0.1",
  "torch>=2.7.0",
  "torchvision>=0.24.0",
  "scipy>=1.16.0",
  "einops>=0.8.1", # NOTE: required by anyloc
  "pytorch-lightning>=2.6.0", # NOTE: required by cliquemining
  "fast-pytorch-kmeans>=0.2.2", # NOTE: required by anyloc
  "pytorch-metric-learning>=2.9.0", # NOTE: required by cliquemining and salad
  "click>=8.1.7",
  "rich>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/markvilar/viper"
Repository = "https://github.com/markvilar/viper"
Issues = "https://github.com/markvilar/viper/issues"

[project.scripts]
viper = "viper.cli.entrypoint:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
include = ["src/viper"]

[tool.hatch.build.targets.wheel]
packages = ["src/viper"]

[tool.uv]
package = true

[tool.uv.sources]

[tool.ruff]
line-length = 88 # default line width of ruff format

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "ruff>=0.8.3",
]
