[project]
name = "libviper"
version = "0.3.0"
description = "A package for visual place recognition (VPR) models."
readme = "README.md"
authors = [
  { name = "Martin Kvisvik Larsen", email = "martin.kvisvik.larsen@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
  "imageio>=2.37.0",
  "loguru>=0.7.3",
  "msgspec>=0.19.0",
  "pytest>=8.3.4",
  "python-dotenv>=1.0.1",
  "ruff>=0.8.3",
  "torch>=2.7.0",
  "torchvision>=0.24.0",
  "scipy>=1.16.0",
  "einops>=0.8.1", # NOTE: required by anyloc
  "xformers>=0.0.30", # NOTE: required by megaloc
  "pytorch-lightning>=2.6.0", # NOTE: required by cliquemining
  "fast-pytorch-kmeans>=0.2.2", # NOTE: required by anyloc
  "pytorch-metric-learning>=2.9.0", # NOTE: required by cliquemining and salad
  "click>=8.1.7",
  "rich>=15.0.0",
]

[project.scripts]
viper = "viper.cli.entrypoint:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["src/viper"]

[tool.hatch.build.targets.wheel]
packages = ["src/viper"]

[tool.uv]
package = true

[tool.uv.sources]

[tool.ruff]
line-length = 88 # default line width of ruff format

[dependency-groups]
dev = [
  "ruff>=0.8.3",
]
